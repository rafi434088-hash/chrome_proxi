name: Chrome GUI with Xpra

on:
  workflow_dispatch:

# Fixed public address: https://ssh.tsoolgee.uk  (Cloudflare tunnel "chrome_proxy"
# a8a043d1-f429-4849-947d-713a5b7d7ac4 -> http://localhost:41234).
#
# NetFree (the user's filter) allows plain HTTPS to this domain but blocks the
# WebSocket 101 upgrade (risk-type). So Xpra's WebSocket cannot be reached
# directly from a filtered machine.
#
# Bypass: an Xray server runs on the runner with an **XHTTP** inbound (path
# /xhttp). XHTTP carries the connection as ordinary HTTP GET/POST requests -- no
# 101, so NetFree sees only normal HTTPS and lets it through. A tiny Xray client
# on the user's PC exposes http://127.0.0.1:8000 which is tunnelled over XHTTP to
# this server and out to Xpra (127.0.0.1:41235). The browser then talks to
# localhost (local WebSocket, NetFree not involved) with all Xpra features intact.
#
# Layout on the runner:
#   xpra      127.0.0.1:41235   (HTML5 + WebSocket, localhost only)
#   xray      127.0.0.1:2096    (vless + xhttp inbound, path /xhttp)
#   nginx     0.0.0.0:41234     -> /xhttp* to xray, everything else to xpra
#   cloudflared  ssh.tsoolgee.uk -> 41234
env:
  PUBLIC_HOST: ssh.tsoolgee.uk
  EDGE_PORT: "41234"
  XPRA_PORT: "41235"
  XRAY_PORT: "2096"
  XHTTP_PATH: "/xhttp"
  XRAY_UUID: "91421d21-52a3-427e-982f-cd1c10bc7955"

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check tunnel secret is present
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$TUNNEL_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_TUNNEL_TOKEN is missing."
            exit 1
          fi
          echo "Tunnel token present."

      - name: Install Xpra 6 + audio + Hebrew + file tools + nginx
        run: |
          sudo wget -q -O /usr/share/keyrings/xpra.asc https://xpra.org/xpra.asc
          sudo wget -q -O /etc/apt/sources.list.d/xpra.sources \
            https://raw.githubusercontent.com/Xpra-org/xpra/master/packaging/repos/noble/xpra.sources
          sudo apt-get update
          sudo apt-get install -y \
            xpra xpra-x11 xpra-html5 xpra-audio-server xpra-codecs \
            pulseaudio pulseaudio-utils dbus-x11 \
            gstreamer1.0-pulseaudio gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly \
            gstreamer1.0-tools \
            fonts-noto-core fonts-noto-color-emoji fonts-liberation culmus \
            x11-xkb-utils pcmanfm gpicview evince mousepad file-roller \
            unzip p7zip-full xdg-utils shared-mime-info desktop-file-utils locales \
            nginx-light
          sudo locale-gen he_IL.UTF-8 || true
          sudo update-mime-database /usr/share/mime 2>/dev/null || true
          sudo update-desktop-database 2>/dev/null || true

      - name: Install cloudflared + xray
        run: |
          wget -q -O cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

          wget -q -O xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          sudo unzip -o xray.zip xray -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray
          /usr/local/bin/xray version | head -1

      - name: Configure Chrome (Hebrew UI + auto-translate + downloads)
        run: |
          mkdir -p "$HOME/Downloads" "$HOME/.config/google-chrome/Default"
          printf '%s' '{"intl":{"accept_languages":"he,he-IL,en-US,en","selected_languages":"he,he-IL,en-US,en"},"translate":{"enabled":true},"translate_recent_target":"he","translate_allowlists":{"en":"he","fr":"he","ar":"he","ru":"he","es":"he","de":"he","it":"he"},"translate_blocked_languages":["he","iw"],"browser":{"has_seen_welcome_page":true},"download":{"default_directory":"/home/runner/Downloads","prompt_for_download":false,"directory_upgrade":true}}' \
            > "$HOME/.config/google-chrome/Default/Preferences"
          sudo mkdir -p /etc/opt/chrome/policies/managed
          printf '%s' '{"ForcedLanguages":["he","he-IL","en-US","en"],"TranslateEnabled":true}' \
            | sudo tee /etc/opt/chrome/policies/managed/hebrew.json >/dev/null
          xdg-mime default pcmanfm.desktop inode/directory 2>/dev/null || true
          xdg-mime default org.gnome.Evince.desktop application/pdf 2>/dev/null || true
          xdg-mime default gpicview.desktop image/png image/jpeg image/gif image/webp 2>/dev/null || true
          xdg-mime default mousepad.desktop text/plain 2>/dev/null || true

      - name: Start Xpra (internal, localhost:41235)
        run: |
          export LANG=he_IL.UTF-8
          export LANGUAGE=he:he_IL:en
          export LC_MESSAGES=he_IL.UTF-8
          mkdir -p "$HOME/Downloads"

          xpra start :100 \
            --bind-tcp=127.0.0.1:${XPRA_PORT} \
            --html=on \
            --daemon=yes \
            --exit-with-children=yes \
            --resize-display=1280x720 \
            --pulseaudio=yes \
            --speaker=yes \
            --speaker-codec=mp3 \
            --microphone=no \
            --clipboard=yes \
            --clipboard-direction=both \
            --file-transfer=yes \
            --open-files=yes \
            --open-url=yes \
            --keyboard-sync=no \
            --webcam=no \
            --mdns=no \
            --notifications=yes \
            --bell=no \
            --quality=50 \
            --min-quality=20 \
            --start="pcmanfm /home/runner/Downloads" \
            --start-child="google-chrome \
              --lang=he \
              --no-sandbox \
              --disable-dev-shm-usage \
              --disable-session-crashed-bubble \
              --disable-sync \
              --disable-background-networking \
              --disable-background-timer-throttling \
              --disable-renderer-backgrounding \
              --disable-component-update \
              --disable-features=BackForwardCache \
              --no-first-run \
              --no-default-browser-check \
              --autoplay-policy=no-user-gesture-required \
              --renderer-process-limit=4 \
              --window-size=1280,720"

          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "http://127.0.0.1:${XPRA_PORT}/" && break
            sleep 2
          done
          if ! curl -fsS -o /dev/null "http://127.0.0.1:${XPRA_PORT}/"; then
            echo "::error::Xpra did not come up on port ${XPRA_PORT}"
            tail -50 /run/user/$(id -u)/xpra/:100.log 2>/dev/null || true
            exit 1
          fi
          echo "Xpra up on 127.0.0.1:${XPRA_PORT}."

      - name: Start Xray XHTTP server (127.0.0.1:2096)
        run: |
          cat > xray-server.json <<JSON
          {
            "log": { "loglevel": "warning" },
            "inbounds": [
              {
                "listen": "127.0.0.1",
                "port": ${XRAY_PORT},
                "protocol": "vless",
                "settings": {
                  "clients": [ { "id": "${XRAY_UUID}" } ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "xhttp",
                  "xhttpSettings": { "path": "${XHTTP_PATH}", "mode": "auto" }
                }
              }
            ],
            "routing": {
              "rules": [
                { "type": "field", "ip": ["127.0.0.1"], "port": ${XPRA_PORT}, "outboundTag": "xpra" }
              ]
            },
            "outbounds": [
              { "tag": "xpra",  "protocol": "freedom" },
              { "tag": "block", "protocol": "blackhole" }
            ]
          }
          JSON

          nohup /usr/local/bin/xray run -c xray-server.json > xray.log 2>&1 &
          sleep 3
          if ! curl -s -o /dev/null "http://127.0.0.1:${XRAY_PORT}${XHTTP_PATH}"; then
            echo "xray xhttp inbound reachable check (non-fatal):"
          fi
          echo "xray log:"; tail -20 xray.log || true
          pgrep -a xray || { echo "::error::xray did not start"; cat xray.log; exit 1; }

      - name: Start nginx (edge 41234 -> xhttp:xray, rest:xpra)
        run: |
          sudo tee /etc/nginx/conf.d/xpra.conf >/dev/null <<NGINX
          map \$http_upgrade \$connection_upgrade {
              default upgrade;
              ''      close;
          }

          server {
              listen ${EDGE_PORT};
              listen [::]:${EDGE_PORT};
              server_name _;
              client_max_body_size 0;

              # Xray XHTTP endpoint: plain HTTP GET/POST streaming, no upgrade.
              location ${XHTTP_PATH} {
                  proxy_pass http://127.0.0.1:${XRAY_PORT};
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header Connection "";
                  proxy_buffering off;
                  proxy_request_buffering off;
                  chunked_transfer_encoding on;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }

              # Everything else = the Xpra HTML5 app (direct HTTP/WS, for clients
              # that are NOT behind NetFree).
              location / {
                  proxy_pass http://127.0.0.1:${XPRA_PORT};
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection \$connection_upgrade;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
                  proxy_buffering off;
              }
          }
          NGINX

          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl restart nginx || sudo service nginx restart

          for i in $(seq 1 15); do
            curl -fsS -o /dev/null "http://127.0.0.1:${EDGE_PORT}/" && break
            sleep 2
          done
          curl -fsS -o /dev/null "http://127.0.0.1:${EDGE_PORT}/" || {
            echo "::error::nginx edge not up on ${EDGE_PORT}"
            sudo tail -40 /var/log/nginx/error.log 2>/dev/null || true
            exit 1
          }
          echo "nginx edge up."

      - name: Start Cloudflare Tunnel (fixed hostname)
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          nohup cloudflared --no-autoupdate --protocol quic \
            tunnel run --token "$TUNNEL_TOKEN" > tunnel.log 2>&1 &
          for i in $(seq 1 45); do
            grep -q "Registered tunnel connection" tunnel.log && break
            sleep 2
          done
          if ! grep -q "Registered tunnel connection" tunnel.log; then
            echo "::error::cloudflared failed to register a tunnel connection"
            tail -60 tunnel.log; exit 1
          fi
          echo "Registered edge connections: $(grep -c 'Registered tunnel connection' tunnel.log)"

      - name: Verify (HTTP page + XHTTP endpoint reachable via the edge)
        run: |
          URL="https://${PUBLIC_HOST}/"
          OK=0; CODE=000
          for i in $(seq 1 30); do
            CODE=$(curl -s -o body.html -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            if [ "$CODE" = "200" ] && grep -qi "xpra" body.html; then OK=1; break; fi
            echo "attempt $i: HTTP $CODE"; sleep 5
          done
          if [ "$OK" != "1" ]; then
            echo "::error::${URL} not serving Xpra (last HTTP ${CODE})"
            head -c 400 body.html; tail -30 tunnel.log; exit 1
          fi
          echo "Xpra page OK through the edge."

          # The XHTTP path should answer over HTTPS (any non-000 code = reachable;
          # a bare GET without the xray handshake typically yields 404/400, which
          # still proves the route + streaming pass NetFree/Cloudflare).
          XC=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://${PUBLIC_HOST}${XHTTP_PATH}/probe" || echo 000)
          echo "XHTTP endpoint https code: ${XC}"

          FULL="http://127.0.0.1:8000/?sound=on&audio_codec=mp3&clipboard=on"
          echo "=============================================================="
          echo " Cloud server is up. On the PC run the local launcher, then open:"
          echo " ${FULL}"
          echo "=============================================================="
          printf 'LOCAL=%s\nHOST=%s\nUUID=%s\nPATH=%s\n' "${FULL}" "${PUBLIC_HOST}" "${XRAY_UUID}" "${XHTTP_PATH}" \
            > "${GITHUB_WORKSPACE}/connection.txt"
          { echo "### Cloud Chrome server is live (XHTTP)"; echo ""; echo "Run the local launcher, then open \`http://127.0.0.1:8000/\`"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish connection info
        uses: actions/upload-artifact@v4
        with:
          name: connection
          path: connection.txt
          retention-days: 1

      - name: Keep alive (health watchdog)
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          END=$(( $(date +%s) + 20400 ))
          FAILS=0
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 300
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://${PUBLIC_HOST}/" || echo 000)
            pgrep -x xray >/dev/null || { echo "xray died, restarting"; nohup /usr/local/bin/xray run -c xray-server.json >> xray.log 2>&1 & }
            if [ "$CODE" = "200" ]; then
              FAILS=0; echo "$(date -u +%H:%M:%S) health OK"
            else
              FAILS=$((FAILS + 1)); echo "$(date -u +%H:%M:%S) health FAIL ($CODE) $FAILS/3"
              if [ "$FAILS" -ge 3 ]; then
                pkill -f cloudflared || true; sleep 3
                nohup cloudflared --no-autoupdate --protocol quic \
                  tunnel run --token "$TUNNEL_TOKEN" >> tunnel.log 2>&1 &
                FAILS=0
              fi
            fi
          done
